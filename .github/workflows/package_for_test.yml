name: Package Neuron for Test

# SECURITY NOTE: This workflow runs on issue_comment events, which execute in the
# base repository context where secrets are available. We intentionally checkout
# refs/pull/<number>/merge instead of the PR author's fork (head_owner/head_repo)
# to avoid explicit untrusted-repository checkout. Do NOT revert to fork-based
# checkout without a full security review.
# See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests
on:
  issue_comment:
    types: [created]
  push:

jobs:
  packaging:
    # Only respond to an exact /package comment from an OWNER/COLLABORATOR on a
    # pull request, or to trusted push events.
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/package' && contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) || github.event_name == 'push' }}

    # Require a maintainer to approve before PR code runs in this privileged context.
    environment: ${{ github.event_name == 'issue_comment' && 'package-for-test' || '' }}

    strategy:
      matrix:
        node: [22]
        os:
          - macos-15-intel
          - ubuntu-latest
          - windows-2022

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: read

    name: ${{ matrix.os }}(Node.js ${{ matrix.node }})

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout for push
        uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' }}

      - name: Checkout for PR
        uses: actions/checkout@v4
        if: ${{ github.event_name == 'issue_comment' }}
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Ensure no more commits after the triggering comment
        uses: actions/github-script@v7
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          ISSUE_NUMBER: ${{github.event.issue.number}}
          COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const { ISSUE_NUMBER, COMMENT_ID } = process.env
            let page = 1
            let hasFoundComment = false
            while(true) {
              const { data: timelines } = await github.rest.issues.listEventsForTimeline({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ISSUE_NUMBER,
                page,
                per_page: 100,
              })
              if (timelines.some(v => {
                hasFoundComment = hasFoundComment || (v.event === 'commented' && `${v.id}` === `${COMMENT_ID}`)
                return hasFoundComment && v.event === 'committed'
              })) {
                throw new Error('The last commit comes after the comment, please comment and package after last commit')
              }
              if (timelines.length === 0) {
                return
              }
              page += 1
            }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"

      - name: Restore
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: 2022-12-21-${{ runner.os }}-${{ hashFiles('**/yarn.lock')}}

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Install Lerna
        run: yarn global add lerna

      - name: Bootstrap
        # Use --frozen-lockfile when triggered by a PR comment so that a malicious
        # PR cannot silently introduce unaudited dependencies during packaging.
        run: |
          yarn ${{ github.event_name == 'issue_comment' && '--frozen-lockfile' || '' }}
        env:
          CI: false

      - name: Write electron-build Test yml
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const ympPath = 'packages/neuron-wallet/electron-builder.yml'
            fs.writeFileSync(ympPath, fs.readFileSync(ympPath).toString().replace('asar: true', 'asar: false'))

      - name: Package for MacOS
        if: runner.os == 'macOS'
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          ./scripts/download-ckb.sh mac
          yarn package:test mac
        env:
          # Do not expose GITHUB_TOKEN to PR code. Only pass it for trusted push events.
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
          SKIP_NOTARIZE: true
          USE_HARD_LINKS: false

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          bash ./scripts/download-ckb.sh win
          yarn build
          bash ./scripts/copy-ui-files.sh
          bash ./scripts/package-for-test.sh win
        env:
          # Do not expose GITHUB_TOKEN to PR code. Only pass it for trusted push events.
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          ./scripts/download-ckb.sh
          yarn package:test linux
        env:
          # Do not expose GITHUB_TOKEN to PR code. Only pass it for trusted push events.
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
          USE_HARD_LINKS: false

      - name: Upload Neuron App Zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Mac-x64
          path: release/Neuron-*-mac-x64.zip

      - name: Upload Neuron App Zip(arm64)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Mac-arm64
          path: release/Neuron-*-mac-arm64.zip

      - name: Upload Neuron Dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Dmg-x64
          path: release/Neuron-*-x64.dmg

      - name: Upload Neuron Dmg(arm64)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Dmg-arm64
          path: release/Neuron-*-arm64.dmg

      - name: Upload Neuron Win
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Win
          path: release/Neuron-*-setup.exe

      - name: Upload Neuron Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Linux
          path: release/Neuron-*.AppImage

  comment_when_package_success:
    needs: [packaging]
    name: Append links to the Pull Request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Comment by push event
        if: ${{ github.event_name == 'push' }}
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            Packaging for test is done in [${{ github.run_id }}](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}})

      - name: Comment by pull request comment event
        if: ${{ github.event_name == 'issue_comment' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          body: |
            Packaging for test is done in [${{ github.run_id }}](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}). @${{ github.event.comment.user.login }}
          edit-mode: append

  comment_when_package_failed:
    needs: [packaging]
    if: ${{ always() && needs.packaging.result == 'failure' }}
    name: Append failed comment to the comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment by pull request comment event when package failed
        if: ${{ github.event_name == 'issue_comment' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          body: Packageing failed in [${{ github.run_id }}](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}). @${{ github.event.comment.user.login }}
          edit-mode: append
