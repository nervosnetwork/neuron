[default]
# OAuth client IDs are opaque identifiers, not prose.
extend-ignore-re = ["(?m)^CLIENT_ID=[A-Za-z0-9_-]+$"]

[default.extend-words]
thur = "thur"
numer = "numer"
HD = "HD"
hd = "hd"
passin = 'passin'

# defined in database schema
lastest = "lastest"

[files]
extend-exclude = ["CHANGELOG.md", "**/migrations/*.ts", "**/fr.{ts,json}", "**/es.{ts,json}"]
